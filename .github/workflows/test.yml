name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    uses: chrvadala/github-actions/.github/workflows/test-nodejs.yml@v2
    permissions:
      contents: read
      checks: write
      pull-requests: write
    with:
      node-versions: '[24,26]'
      coveralls_enabled: false
      # Setup dbus permissions
      command: | 
        sudo sh -c 'sed "s/my_username/runner/g" node-ble.conf > /etc/dbus-1/system.d/dbus.conf'
        